<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>SOC Investigation Lab</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #090b0f;
        color: #e5e8ee;
        font: 13px/1.5 system-ui, "Segoe UI", Ubuntu, sans-serif;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #98a1b3;
      }
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: #1f2531;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #4d8dff;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="build/icon.png" alt="" />
      <h1>SOC Investigation Lab</h1>
      <p>Starting the detection engine and loading the lab dataset...</p>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
    </main>
  </body>
</html>
