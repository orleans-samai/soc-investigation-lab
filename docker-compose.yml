name: soc-investigation-lab

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      SOCLAB_STATE_DIR: /app/state
    volumes:
      - lab-state:/app/state
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  lab-state:
